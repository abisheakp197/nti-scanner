[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nti-scanner"
version = "0.1.0"
description = "Professional NTI-1 compliance and AI agent security scanner"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "abisheakp197"}
]
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
nti-scanner = "nti_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nti_scanner*"]
