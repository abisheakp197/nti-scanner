[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: unit tests
    rule: individual rule tests
    contract: output format contract tests
    integration: end-to-end scanner tests
    failure: failure mode tests
    performance: performance benchmarks
    regression: score stability tests
